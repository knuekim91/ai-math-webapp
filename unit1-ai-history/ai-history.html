<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인공지능의 역사 | 인공지능 수학 학습 도구</title>
<link rel="stylesheet" href="../assets/common.css" />
<style>
  .mode-switch {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .mode-switch button {
    background: var(--color-surface);
    color: var(--color-text-muted);
    border: 1px solid var(--color-border);
  }
  .mode-switch button.active {
    background: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
  }

  /* ---- 학습 모드: 타임라인 ---- */
  .timeline {
    position: relative;
    padding-left: 26px;
    border-left: 3px solid var(--color-border);
  }
  .era-block {
    margin-bottom: 46px;
    position: relative;
  }
  .era-block::before {
    content: "";
    position: absolute;
    left: -32px;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--color-primary);
    border: 3px solid var(--color-surface);
    box-shadow: 0 0 0 2px var(--color-primary);
  }
  .era-head h2 {
    margin: 0 0 2px;
    font-size: 1.15rem;
  }
  .era-head .range {
    font-size: 0.8rem;
    color: var(--color-accent);
    font-weight: 700;
  }
  .era-head p {
    margin: 6px 0 18px;
    color: var(--color-text-muted);
    font-size: 0.9rem;
  }
  .event-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .event-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .event-card .imgs {
    display: flex;
  }
  .event-card .imgs img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .event-card .imgs.no-img {
    display: none;
  }
  .event-card .body {
    padding: 14px 16px;
  }
  .event-card .year {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: white;
    background: var(--color-primary);
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .event-card h3 {
    margin: 0 0 6px;
    font-size: 1rem;
  }
  .event-card p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-text-muted);
  }
  .event-card .credit {
    display: block;
    font-size: 0.65rem;
    color: var(--color-text-muted);
    padding: 3px 16px 0;
    opacity: 0.7;
  }

  /* ---- 복습 모드: 드래그 앤 드롭 ---- */
  #reviewMode { display: none; }
  .review-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .score-badge {
    font-weight: 700;
    background: var(--color-bg);
    border-radius: 999px;
    padding: 8px 16px;
  }
  #cardPool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 56px;
    padding: 14px;
    background: var(--color-bg);
    border: 1px dashed var(--color-border);
    border-radius: 12px;
    margin-bottom: 26px;
  }
  .event-chip {
    cursor: grab;
    user-select: none;
    background: var(--color-surface);
    border: 2px solid var(--color-border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: var(--shadow-card);
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .event-chip.selected {
    border-color: var(--color-primary);
    transform: translateY(-2px);
  }
  .event-chip.correct {
    border-color: var(--color-accent);
    background: #e9fbf7;
    cursor: default;
    opacity: 0.85;
  }
  .event-chip.wrong {
    animation: shake 0.35s;
    border-color: #ff5b77;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .buckets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .bucket {
    min-height: 130px;
    border: 2px dashed var(--color-border);
    border-radius: 12px;
    padding: 12px;
    background: var(--color-surface);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bucket.dragover {
    background: var(--color-bg);
    border-color: var(--color-primary);
  }
  .bucket h4 {
    margin: 0 0 4px;
    font-size: 0.85rem;
  }
  .bucket .range {
    font-size: 0.7rem;
    color: var(--color-accent);
    font-weight: 700;
    display: block;
    margin-bottom: 8px;
  }
  .bucket .slot {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 30px;
  }

  /* ---- 복습 모드: 확인 퀴즈 ---- */
  .step-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 1.1rem;
  }
  .step-title .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--color-primary);
    color: white;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .quiz-progress {
    font-size: 0.82rem;
    color: var(--color-text-muted);
    margin-bottom: 10px;
  }
  .quiz-question {
    font-size: 1.02rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .quiz-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .quiz-choice {
    text-align: left;
    background: var(--color-surface);
    border: 1.5px solid var(--color-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.92rem;
    cursor: pointer;
    color: var(--color-text);
  }
  .quiz-choice:hover:not(:disabled) {
    border-color: var(--color-primary);
  }
  .quiz-choice.correct {
    border-color: var(--color-accent);
    background: #e9fbf7;
    font-weight: 700;
  }
  .quiz-choice.wrong {
    border-color: #ff5b77;
    background: #ffecec;
  }
  .quiz-choice:disabled {
    cursor: default;
    opacity: 0.85;
  }
  .quiz-explain {
    font-size: 0.86rem;
    color: var(--color-text-muted);
    background: var(--color-bg);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: none;
  }
  .quiz-final {
    text-align: center;
    padding: 20px 0 4px;
  }
  .quiz-final .big-score {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--color-primary-dark);
  }

  .summary-panel {
    background: linear-gradient(135deg, #eef0ff, #e9fbf7);
    border-radius: 14px;
  }
  .summary-panel .big-pct {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--color-primary-dark);
  }
  .summary-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin: 14px 0;
  }
  .summary-row .item {
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="page-wrap">
  <div class="tool-header">
    <h1>🕰️ 인공지능의 역사</h1>
    <p>1900년대 계산 이론의 뿌리부터 오늘날 생성형 AI까지, 인공지능이 걸어온 길을 살펴보고 직접 시대순으로 정리해봅시다.</p>
  </div>

  <div class="mode-switch">
    <button id="btnLearn" class="active">📖 학습 모드</button>
    <button id="btnReview">🎮 복습 모드 (형성평가)</button>
  </div>

  <!-- ===================== 학습 모드 ===================== -->
  <div id="learnMode">
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- ===================== 복습 모드 (형성평가) ===================== -->
  <div id="reviewMode">
    <div class="panel">
      <h2 class="step-title"><span class="num">1</span> 시대별로 분류하기</h2>
      <p style="margin-top:0;">카드를 알맞은 시대 칸으로 <strong>드래그</strong>하거나, 카드를 <strong>탭한 뒤 원하는 칸을 탭</strong>해서 놓아보세요. 다 놓았으면 채점해보세요.</p>
      <div class="review-toolbar">
        <div class="score-badge">정답 <span id="scoreVal">0</span> / <span id="scoreTotal">0</span></div>
        <div class="controls" style="margin:0;">
          <button id="gradeBtn">채점하기</button>
          <button class="secondary" id="shuffleBtn">다시 섞기</button>
        </div>
      </div>
      <div id="cardPool"></div>
      <div class="buckets" id="buckets"></div>
    </div>

    <div class="panel" id="quizPanel">
      <h2 class="step-title"><span class="num">2</span> 확인 퀴즈</h2>
      <div id="quizArea"></div>
    </div>

    <div class="panel summary-panel" id="summaryPanel" style="display:none;">
      <h2 style="margin-top:0;">📋 형성평가 결과</h2>
      <div class="big-pct" id="summaryPct">-</div>
      <div class="summary-row">
        <div class="item">1단계 시대 분류: <strong id="summaryDrag">-</strong></div>
        <div class="item">2단계 확인 퀴즈: <strong id="summaryQuiz">-</strong></div>
      </div>
      <p id="summaryMsg" style="font-weight:700;"></p>
      <button id="retryAllBtn">전체 다시 풀기</button>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="../assets/common.js"></script>

// ---------------- 학습 모드 렌더 ----------------
const timelineEl = document.getElementById("timeline");
ERAS.forEach(era => {
  const block = document.createElement("div");
  block.className = "era-block";
  const evs = EVENTS.filter(e => e.era === era.id);
  block.innerHTML =
    '<div class="era-head"><span class="range">' + era.range + '</span><h2>' + era.label + '</h2><p>' + era.desc + '</p></div>' +
    '<div class="event-grid">' +
    evs.map(ev => {
      const imgsHtml = ev.imgs.length
        ? '<div class="imgs">' + ev.imgs.map(im => '<img src="' + im.src + '" alt="' + im.alt + '" loading="lazy">').join("") + '</div>' +
          '<span class="credit">사진: ' + CREDIT + '</span>'
        : "";
      return '<div class="event-card">' + imgsHtml +
        '<div class="body"><span class="year">' + ev.year + '</span><h3>' + ev.title + '</h3><p>' + ev.desc + '</p></div></div>';
    }).join("") +
    '</div>';
  timelineEl.appendChild(block);
});

// ---------------- 모드 전환 ----------------
const btnLearn = document.getElementById("btnLearn");
const btnReview = document.getElementById("btnReview");
const learnMode = document.getElementById("learnMode");
const reviewMode = document.getElementById("reviewMode");

btnLearn.addEventListener("click", () => {
  btnLearn.classList.add("active");
  btnReview.classList.remove("active");
  learnMode.style.display = "";
  reviewMode.style.display = "none";
});
btnReview.addEventListener("click", () => {
  btnReview.classList.add("active");
  btnLearn.classList.remove("active");
  reviewMode.style.display = "";
  learnMode.style.display = "none";
});

// ---------------- 복습 모드: 드래그 앤 드롭 ----------------
const cardPool = document.getElementById("cardPool");
const bucketsEl = document.getElementById("buckets");
const scoreVal = document.getElementById("scoreVal");
const scoreTotal = document.getElementById("scoreTotal");
scoreTotal.textContent = EVENTS.length;

let selectedChip = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBuckets() {
  bucketsEl.innerHTML = "";
  ERAS.forEach(era => {
    const b = document.createElement("div");
    b.className = "bucket";
    b.dataset.era = era.id;
    b.innerHTML = '<h4>' + era.label + '</h4><span class="range">' + era.range + '</span><div class="slot"></div>';
    bucketsEl.appendChild(b);
    attachBucketEvents(b);
  });
}

function buildChip(ev) {
  const chip = document.createElement("div");
  chip.className = "event-chip";
  chip.draggable = true;
  chip.dataset.id = ev.id;
  chip.dataset.era = ev.era;
  chip.textContent = ev.title;

  chip.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", ev.id);
    setTimeout(() => chip.style.opacity = "0.4", 0);
  });
  chip.addEventListener("dragend", () => { chip.style.opacity = "1"; });

  chip.addEventListener("click", () => {
    if (chip.classList.contains("correct")) return;
    if (selectedChip === chip) {
      chip.classList.remove("selected");
      selectedChip = null;
      return;
    }
    if (selectedChip) selectedChip.classList.remove("selected");
    selectedChip = chip;
    chip.classList.add("selected");
  });

  return chip;
}

function attachBucketEvents(bucket) {
  bucket.addEventListener("dragover", e => { e.preventDefault(); bucket.classList.add("dragover"); });
  bucket.addEventListener("dragleave", () => bucket.classList.remove("dragover"));
  bucket.addEventListener("drop", e => {
    e.preventDefault();
    bucket.classList.remove("dragover");
    const id = e.dataTransfer.getData("text/plain");
    const chip = document.querySelector('.event-chip[data-id="' + id + '"]');
    if (chip) bucket.querySelector(".slot").appendChild(chip);
  });
  bucket.addEventListener("click", () => {
    if (selectedChip) {
      bucket.querySelector(".slot").appendChild(selectedChip);
      selectedChip.classList.remove("selected");
      selectedChip = null;
    }
  });
}

function setupReview() {
  cardPool.innerHTML = "";
  buildBuckets();
  shuffle(EVENTS).forEach(ev => cardPool.appendChild(buildChip(ev)));
  scoreVal.textContent = "0";
}

document.getElementById("shuffleBtn").addEventListener("click", setupReview);

let dragDropScore = 0;
let dragDropAttempted = false;

document.getElementById("gradeBtn").addEventListener("click", () => {
  let correct = 0;
  document.querySelectorAll(".bucket").forEach(bucket => {
    const eraId = bucket.dataset.era;
    bucket.querySelectorAll(".event-chip").forEach(chip => {
      if (chip.classList.contains("correct")) { correct++; return; }
      if (chip.dataset.era === eraId) {
        chip.classList.add("correct");
        correct++;
      } else {
        chip.classList.add("wrong");
        setTimeout(() => {
          chip.classList.remove("wrong");
          cardPool.appendChild(chip);
        }, 400);
      }
    });
  });
  scoreVal.textContent = correct;
  dragDropScore = correct;
  dragDropAttempted = true;
  updateSummary();
});

// ---------------- 복습 모드: 확인 퀴즈 ----------------
const quizArea = document.getElementById("quizArea");
let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;
let quizAttempted = false;

function setupQuiz() {
  quizOrder = shuffle(QUIZ.map((q, i) => i));
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = QUIZ[quizOrder[quizIndex]];
  quizArea.innerHTML = `
    <div class="quiz-progress">문제 ${quizIndex + 1} / ${QUIZ.length} · 맞은 개수 ${quizScore}</div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div class="quiz-explain" id="quizExplain"></div>
    <button id="quizNextBtn" style="display:none;">${quizIndex === QUIZ.length - 1 ? "결과 보기" : "다음 문제"}</button>
  `;
  const choicesEl = document.getElementById("quizChoices");
  q.choices.forEach((choiceText, idx) => {
    const btn = document.createElement("button");
    btn.className = "quiz-choice";
    btn.textContent = choiceText;
    btn.addEventListener("click", () => answerQuiz(idx));
    choicesEl.appendChild(btn);
  });
}

function answerQuiz(chosenIdx) {
  const q = QUIZ[quizOrder[quizIndex]];
  const buttons = document.querySelectorAll("#quizChoices .quiz-choice");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) b.classList.add("correct");
    else if (idx === chosenIdx) b.classList.add("wrong");
  });
  if (chosenIdx === q.answer) quizScore++;
  const explainEl = document.getElementById("quizExplain");
  explainEl.textContent = "💡 " + q.explain;
  explainEl.style.display = "";
  document.querySelector(".quiz-progress").textContent = `문제 ${quizIndex + 1} / ${QUIZ.length} · 맞은 개수 ${quizScore}`;
  const nextBtn = document.getElementById("quizNextBtn");
  nextBtn.style.display = "";
  nextBtn.addEventListener("click", () => {
    if (quizIndex < QUIZ.length - 1) {
      quizIndex++;
      renderQuizQuestion();
    } else {
      finishQuiz();
    }
  }, { once: true });
}

function finishQuiz() {
  quizAttempted = true;
  quizArea.innerHTML = `
    <div class="quiz-final">
      <div class="big-score">${quizScore} / ${QUIZ.length}</div>
      <p>퀴즈를 완료했습니다.</p>
      <button id="quizRetryBtn" class="secondary">퀴즈 다시 풀기</button>
    </div>
  `;
  document.getElementById("quizRetryBtn").addEventListener("click", setupQuiz);
  updateSummary();
}

function updateSummary() {
  const summaryPanel = document.getElementById("summaryPanel");
  if (!dragDropAttempted || !quizAttempted) { summaryPanel.style.display = "none"; return; }
  const totalCorrect = dragDropScore + quizScore;
  const totalCount = EVENTS.length + QUIZ.length;
  const pct = Math.round((totalCorrect / totalCount) * 100);
  document.getElementById("summaryPct").textContent = pct + "%";
  document.getElementById("summaryDrag").textContent = `${dragDropScore} / ${EVENTS.length}`;
  document.getElementById("summaryQuiz").textContent = `${quizScore} / ${QUIZ.length}`;
  const msgEl = document.getElementById("summaryMsg");
  if (pct >= 90) msgEl.textContent = "🌟 훌륭해요! 인공지능의 역사를 아주 잘 이해하고 있습니다.";
  else if (pct >= 70) msgEl.textContent = "👍 잘했어요! 조금만 더 복습하면 완벽해질 거예요.";
  else msgEl.textContent = "📖 학습 모드로 돌아가 타임라인을 한 번 더 살펴보는 걸 추천해요.";
  summaryPanel.style.display = "";
}

document.getElementById("retryAllBtn").addEventListener("click", () => {
  dragDropAttempted = false;
  quizAttempted = false;
  document.getElementById("summaryPanel").style.display = "none";
  setupReview();
  setupQuiz();
});

setupReview();
setupQuiz();
</script>
