<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>텍스트 유사도 | 인공지능 수학 학습 도구</title>
<link rel="stylesheet" href="../assets/common.css" />
<style>
  .doc-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .doc-pair { grid-template-columns: 1fr; } }
  .doc-block textarea {
    width: 100%; min-height: 90px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--color-border);
    font-family: inherit; font-size: 0.92rem; resize: vertical;
  }
  .doc-block h4 { margin: 0 0 6px; font-size: 0.9rem; }
  .doc-block.a h4 { color: #2857a6; }
  .doc-block.b h4 { color: #c9302c; }

  .stopword-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stopword-row input[type="text"] {
    flex: 1; min-width: 220px; padding: 7px 10px;
    border-radius: 8px; border: 1px solid var(--color-border); font-size: 0.85rem;
  }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--color-border); border-radius: 999px; transition: 0.15s;
  }
  .slider-toggle::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: 0.15s;
  }
  .switch input:checked + .slider-toggle { background: var(--color-primary); }
  .switch input:checked + .slider-toggle::before { transform: translateX(18px); }

  .step {
    border-left: 4px solid var(--color-primary);
    background: var(--color-bg);
    border-radius: 0 10px 10px 0;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .step h4 { margin: 0 0 10px; font-size: 0.95rem; }
  .token-chip {
    display: inline-block; padding: 3px 10px; margin: 3px 4px 3px 0;
    border-radius: 999px; font-size: 0.8rem; font-family: monospace;
    background: var(--color-surface); border: 1px solid var(--color-border);
  }
  .token-chip.removed { text-decoration: line-through; opacity: 0.45; }

  .vec-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-family: monospace; }
  .vec-table th, .vec-table td { border: 1px solid var(--color-border); padding: 6px 10px; text-align: center; }
  .vec-table th { background: var(--color-surface); }

  .sim-gauge { height: 20px; border-radius: 999px; background: var(--color-border); overflow: hidden; margin: 10px 0; }
  .sim-gauge .fill { height: 100%; background: linear-gradient(90deg, #c9302c, #ffcc00, #2f9e5c); }
  .sim-formula { font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; line-height: 1.9; }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="page-wrap">
  <div class="tool-header">
    <h1>🔤 텍스트 유사도</h1>
    <p>두 문장을 벡터로 바꾸고 코사인 유사도를 계산하는 과정을, 토큰화부터 단계별로 직접 확인해봅시다.</p>
  </div>

  <div class="panel">
    <div class="doc-pair">
      <div class="doc-block a">
        <h4>문서 A</h4>
        <textarea id="docA">나는 사과를 좋아한다</textarea>
      </div>
      <div class="doc-block b">
        <h4>문서 B</h4>
        <textarea id="docB">나는 바나나를 좋아한다</textarea>
      </div>
    </div>
    <div class="controls" style="margin-top:14px;">
      <div class="control-group">
        <label>예시 불러오기</label>
        <div class="btn-group" id="presetBtns" style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="secondary" data-preset="fruit">과일 (비슷함)</button>
          <button class="secondary" data-preset="weather">날씨 (다름)</button>
          <button class="secondary" data-preset="ai">AI 수학 (비슷함)</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="control-group">
        <label style="display:flex; align-items:center; gap:8px;">
          <span class="switch"><input type="checkbox" id="stopwordToggle" checked><span class="slider-toggle"></span></span>
          불용어 제거 사용
        </label>
      </div>
      <div class="control-group" style="flex:1;">
        <label>불용어 목록 (쉼표로 구분)</label>
        <div class="stopword-row">
          <input type="text" id="stopwordList" value="나는,나,는,이,가,을,를,의,에,에서,와,과,도,으로,로,한다,합니다">
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="analyzeBtn">🔍 분석하기</button>
      <button class="secondary" id="resetBtn">초기화</button>
    </div>
  </div>

  <div id="results" style="display:none;"></div>

  <div class="panel">
    <h3 style="margin-top:0;">관찰 포인트</h3>
    <ul>
      <li>여기서는 이해를 돕기 위해 <strong>띄어쓰기 기준</strong>으로 단어를 나눕니다. 실제 자연어 처리는 형태소 분석기로 훨씬 정교하게 단어를 나눕니다.</li>
      <li>불용어(조사·어미 등)를 제거하면 문장의 <strong>핵심 의미 단어</strong>만 남아 비교가 더 정확해집니다.</li>
      <li>코사인 유사도는 <strong>−1 ~ 1</strong> 사이 값이며(단어 개수만 세는 여기서는 보통 0~1), 1에 가까울수록 두 문장이 비슷하다는 뜻입니다.</li>
    </ul>
  </div>
</div>

<div id="site-footer"></div>
<script src="../assets/common.js"></script>
<script>
AIMath.header({ home: "../index.html" });
AIMath.footer();

const PRESETS = {
  fruit: { a: "나는 사과를 좋아한다", b: "나는 바나나를 좋아한다" },
  weather: { a: "나는 사과를 좋아한다", b: "오늘 날씨가 정말 좋다" },
  ai: { a: "인공지능은 데이터를 학습하여 예측한다", b: "인공지능은 데이터를 학습하여 분류한다" },
};

document.getElementById("presetBtns").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-preset]");
  if (!btn) return;
  const p = PRESETS[btn.dataset.preset];
  document.getElementById("docA").value = p.a;
  document.getElementById("docB").value = p.b;
});

function tokenize(text) {
  return text
    .replace(/[.,!?~"'…·]/g, " ")
    .split(/\s+/)
    .map(t => t.trim())
    .filter(t => t.length > 0);
}

function analyze() {
  const textA = document.getElementById("docA").value;
  const textB = document.getElementById("docB").value;
  const useStopwords = document.getElementById("stopwordToggle").checked;
  const stopwords = new Set(
    document.getElementById("stopwordList").value.split(",").map(s => s.trim()).filter(Boolean)
  );

  const tokensA = tokenize(textA);
  const tokensB = tokenize(textB);

  const filteredA = useStopwords ? tokensA.filter(t => !stopwords.has(t)) : tokensA.slice();
  const filteredB = useStopwords ? tokensB.filter(t => !stopwords.has(t)) : tokensB.slice();

  const vocab = Array.from(new Set([...filteredA, ...filteredB]));
  const vecA = vocab.map(w => filteredA.filter(t => t === w).length);
  const vecB = vocab.map(w => filteredB.filter(t => t === w).length);

  const dot = vecA.reduce((s, v, i) => s + v * vecB[i], 0);
  const magA = Math.sqrt(vecA.reduce((s, v) => s + v * v, 0));
  const magB = Math.sqrt(vecB.reduce((s, v) => s + v * v, 0));
  const cos = (magA && magB) ? dot / (magA * magB) : 0;

  renderResults({ tokensA, tokensB, filteredA, filteredB, useStopwords, stopwords, vocab, vecA, vecB, dot, magA, magB, cos });
}

function chipList(tokens, removedSet) {
  return tokens.map(t => {
    const isRemoved = removedSet && removedSet.has(t);
    return `<span class="token-chip${isRemoved ? " removed" : ""}">${t}</span>`;
  }).join("");
}

function renderResults(r) {
  const el = document.getElementById("results");
  el.style.display = "";

  let html = "";

  html += `<div class="panel step">
    <h4>1단계 · 토큰화 (띄어쓰기 기준으로 나누기)</h4>
    <p style="color:var(--color-text-muted); font-size:0.85rem; margin:0 0 6px;">문서 A</p>
    ${chipList(r.tokensA)}
    <p style="color:var(--color-text-muted); font-size:0.85rem; margin:14px 0 6px;">문서 B</p>
    ${chipList(r.tokensB)}
  </div>`;

  if (r.useStopwords) {
    html += `<div class="panel step">
      <h4>2단계 · 불용어 제거 (취소선 = 제거된 단어)</h4>
      <p style="color:var(--color-text-muted); font-size:0.85rem; margin:0 0 6px;">문서 A</p>
      ${chipList(r.tokensA, r.stopwords)}
      <p style="color:var(--color-text-muted); font-size:0.85rem; margin:14px 0 6px;">문서 B</p>
      ${chipList(r.tokensB, r.stopwords)}
    </div>`;
  }

  let tableHtml = `<table class="vec-table"><thead><tr><th>단어 사전</th>${r.vocab.map(w => `<th>${w}</th>`).join("")}</tr></thead><tbody>`;
  tableHtml += `<tr><td>문서 A 벡터</td>${r.vecA.map(v => `<td>${v}</td>`).join("")}</tr>`;
  tableHtml += `<tr><td>문서 B 벡터</td>${r.vecB.map(v => `<td>${v}</td>`).join("")}</tr>`;
  tableHtml += `</tbody></table>`;

  html += `<div class="panel step">
    <h4>${r.useStopwords ? "3" : "2"}단계 · 단어 사전과 빈도 벡터</h4>
    <div style="overflow-x:auto;">${tableHtml}</div>
  </div>`;

  const pct = Math.max(0, Math.min(1, r.cos)) * 100;
  html += `<div class="panel step">
    <h4>${r.useStopwords ? "4" : "3"}단계 · 코사인 유사도 계산</h4>
    <div class="sim-formula">cos(A, B) = (A · B) / (|A| × |B|)
= ${r.dot} / (${r.magA.toFixed(3)} × ${r.magB.toFixed(3)})
= ${r.cos.toFixed(4)}</div>
    <div class="sim-gauge"><div class="fill" style="width:${pct}%"></div></div>
    <p style="font-weight:700;">유사도 ${(r.cos*100).toFixed(1)}% — ${
      r.cos > 0.7 ? "두 문장은 매우 비슷합니다." : r.cos > 0.3 ? "두 문장은 어느 정도 비슷합니다." : "두 문장은 서로 다릅니다."
    }</p>
  </div>`;

  el.innerHTML = html;
}

document.getElementById("analyzeBtn").addEventListener("click", analyze);
document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("results").style.display = "none";
  document.getElementById("results").innerHTML = "";
});

analyze();
</script>
</body>
</html>
